<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitud de alta</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="./css/style.css">
</head>
<body>
    <header>
    <nav>
        <div class="logo">TRADE DIGITAL</div>

        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Productos</a></li>
            <li><a href="#">Contacto</a></li>
            <li><a href="cuenta.html">Solicitud de alta</a></li>
             <li><a href="inicarsesion.html">Iniciar sesión</a></li>
        </ul>
    </nav>
</header>
<form id="formulario" class="container mt-5 mb-5">

    <div class="card p-4">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre *</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Apellidos *</label>
                <input type="text" name="apellidos" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Empresa *</label>
                <input type="text" name="empresa" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">CIF / NIF *</label>
                <input type="text" name="cif" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Teléfono *</label>
                <input type="tel" name="telefono" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Correo electrónico *</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="col-12 mb-3">
                <label class="form-label">Dirección *</label>
                <input type="text" name="direccion" class="form-control" required>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Ciudad *</label>
                <input type="text" name="ciudad" class="form-control" required>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Código Postal *</label>
                <input type="text" name="codigoPostal" class="form-control" required>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Provincia *</label>

                <select name="provincia" class="form-select" required>
                    <option value="">Seleccionar</option>
                    <option>Madrid</option>
                    <option>Barcelona</option>
                    <option>Valencia</option>
                    <option>Sevilla</option>
                    <option>Zaragoza</option>
                </select>

            </div>

            <div class="col-12 mb-4">

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="condiciones"
                        required>

                    <label class="form-check-label" for="condiciones">

                        He leído y acepto las condiciones generales y la política de privacidad
                    </label>

                </div>

            </div>

            <div class="col-12">

                <button type="submit" class="btn btn-primary">
                    Enviar solicitud
                </button>

            </div>

        </div>

    </div>

</form>
</body>
</html>
