<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="./css/style.css">


</head>

<body>
<header>
    <nav>
        <div class="logo">TRADE DIGITAL</div>

        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Productos</a></li>
            <li><a href="#">Contacto</a></li>
            <li><a href="cuenta.html">Solicitud de alta</a></li>
        </ul>
    </nav>
</header>

<!-- CONNEXION -->

<div class="container mt-5">

    <div class="card p-4 mx-auto" style="max-width:500px;">

        <h2 class="text-center mb-4">
            Connexión
        </h2>

        <div class="text-center mb-4">

            <a
            href="cuenta.html"
            class="btn btn-success">

                📝 Inscribirse

            </a>

        </div>

        <form id="authForm">

            <div class="mb-4">

                <label class="form-label">
                    E-mail
                </label>

                <input
                type="email"
                class="form-control"
                id="email"
                placeholder="votre@email.com"
                required>

            </div>

            <button
            type="submit"
            class="btn btn-primary w-100">

               conectar
            </button>

        </form>

    </div>

</div>


<script src="auth-cart.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){

    const usuario = localStorage.getItem("usuario");
    const textoCuenta = document.getElementById("textoCuenta");
    const perfilInicial = document.getElementById("perfilInicial");

    if(usuario){
        window.location.href = "index.html";
        return;
    }

    if(textoCuenta){
        textoCuenta.textContent = usuario;
        textoCuenta.href = "#";
    }

    if(perfilInicial && usuario){
        perfilInicial.textContent = usuario.charAt(0).toUpperCase();
    }

    const authForm = document.getElementById("authForm");
    authForm.addEventListener("submit", function(event){
        event.preventDefault();

        const emailInput = document.getElementById("email");
        const email = emailInput.value.trim();

        if(!email){
            alert("Por favor, escribe tu correo electrónico para iniciar sesión.");
            return;
        }

        if(!window.isRegisteredEmail(email)){
            alert("Este correo no está registrado. Regístrate primero en la página de registro.");
            window.location.href = "cuenta.html";
            return;
        }

        localStorage.setItem("usuario", email);
        localStorage.setItem("sessionActiva", "true");

        window.location.href = "index.html";
    });

});
</script>
</body>

</html>
